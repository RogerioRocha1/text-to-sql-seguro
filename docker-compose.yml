services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-despesas}
      POSTGRES_USER: ${POSTGRES_USER:-carga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_LEITOR_USUARIO: ${POSTGRES_LEITOR_USUARIO:-leitor}
      POSTGRES_LEITOR_SENHA: ${POSTGRES_LEITOR_SENHA:?defina POSTGRES_LEITOR_SENHA no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORTA:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Roda uma vez e termina: baixa os CSV (guardados em data/raw) e recarrega o banco.
  carga:
    build: .
    command: ["python", "-m", "assistente_sql.carga", "--ano", "${ANO_DADOS:-2025}"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carga}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-despesas}
      DADOS_DIR: /dados
    volumes:
      - ./data/raw:/dados
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
