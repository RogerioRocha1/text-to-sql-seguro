services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-despesas}
      POSTGRES_USER: ${POSTGRES_USER:-carga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_LEITOR_USUARIO: ${POSTGRES_LEITOR_USUARIO:-leitor}
      POSTGRES_LEITOR_SENHA: ${POSTGRES_LEITOR_SENHA:?defina POSTGRES_LEITOR_SENHA no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORTA:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Roda e termina: baixa os CSV (guardados em data/raw) e carrega o banco, só se
  # ele estiver vazio. Para recarregar: docker compose run --rm carga python -m assistente_sql.carga
  carga:
    build: .
    command: ["python", "-m", "assistente_sql.carga", "--ano", "${ANO_DADOS:-2025}", "--se-vazio"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carga}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-despesas}
      DADOS_DIR: /dados
    volumes:
      - ./data/raw:/dados
    depends_on:
      db:
        condition: service_healthy

  # Modelo local. Roda na CPU por padrão; para usar GPU NVIDIA, veja docker-compose.gpu.yml.
  ollama:
    image: ollama/ollama:0.40.13
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORTA:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Roda e termina: baixa o modelo só se ele ainda não está no volume (funciona offline depois).
  ollama-modelo:
    image: ollama/ollama:0.40.13
    entrypoint: ["sh", "-c", 'ollama show "$$OLLAMA_MODELO" > /dev/null 2>&1 || ollama pull "$$OLLAMA_MODELO"']
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen2.5-coder:7b}
    depends_on:
      ollama:
        condition: service_healthy

  # Interface web em http://localhost:8501. Consulta o banco só como usuário leitor.
  app:
    build: .
    command:
      - streamlit
      - run
      - src/assistente_sql/app.py
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      DATABASE_URL_LEITOR: postgresql://${POSTGRES_LEITOR_USUARIO:-leitor}:${POSTGRES_LEITOR_SENHA}@db:5432/${POSTGRES_DB:-despesas}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen2.5-coder:7b}
      LIMITE_LINHAS: ${LIMITE_LINHAS:-1000}
      CUSTO_MAXIMO: ${CUSTO_MAXIMO:-1000000}
    ports:
      - "127.0.0.1:${APP_PORTA:-8501}:8501"
    volumes:
      - ./eval:/app/eval
    depends_on:
      carga:
        condition: service_completed_successfully
      ollama-modelo:
        condition: service_completed_successfully

volumes:
  pgdata:
  ollama:
