<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle">
  <title>Arquitetura do assistente text-to-SQL</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="250" fill="#ffffff"/>
  <g fill="#eef1f5" stroke="#555" stroke-width="1.5">
    <rect x="10" y="70" width="110" height="56" rx="6"/>
    <polygon points="210,52 270,98 210,144 150,98"/>
    <rect x="300" y="70" width="120" height="56" rx="6"/>
    <rect x="450" y="70" width="110" height="56" rx="6"/>
    <polygon points="650,46 716,98 650,150 584,98"/>
    <rect x="740" y="70" width="120" height="56" rx="6"/>
    <rect x="885" y="70" width="105" height="56" rx="6"/>
    <rect x="740" y="180" width="120" height="50" rx="6"/>
  </g>
  <g fill="#222">
    <text x="65" y="94">Pergunta</text><text x="65" y="110">do usuário</text>
    <text x="210" y="94">Esclareci-</text><text x="210" y="110">mento</text>
    <text x="360" y="86">Prompt com o</text><text x="360" y="102">esquema lido</text><text x="360" y="118">do banco</text>
    <text x="505" y="94">Modelo local</text><text x="505" y="110">(Ollama)</text>
    <text x="650" y="90">Validador</text><text x="650" y="105">SQLGlot</text><text x="650" y="120">+ EXPLAIN</text>
    <text x="800" y="86">PostgreSQL</text><text x="800" y="102">usuário leitor,</text><text x="800" y="118">só leitura</text>
    <text x="937" y="86">Tabela,</text><text x="937" y="102">gráfico e</text><text x="937" y="118">explicação</text>
    <text x="800" y="201">Consulta bloqueada</text><text x="800" y="217">e motivo</text>
  </g>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#seta)">
    <line x1="120" y1="98" x2="148" y2="98"/>
    <line x1="270" y1="98" x2="298" y2="98"/>
    <line x1="420" y1="98" x2="448" y2="98"/>
    <line x1="560" y1="98" x2="582" y2="98"/>
    <line x1="716" y1="98" x2="738" y2="98"/>
    <line x1="860" y1="98" x2="883" y2="98"/>
    <polyline points="650,150 650,205 738,205"/>
    <path d="M210,52 C210,28 65,28 65,68" stroke-dasharray="5,4"/>
  </g>
  <g fill="#444" font-size="11.5">
    <text x="140" y="20">ambígua: opções em botões</text>
    <text x="284" y="90">clara</text>
    <text x="571" y="90">SQL</text>
    <text x="727" y="90">ok</text>
    <text x="690" y="198">reprovado</text>
  </g>
</svg>
